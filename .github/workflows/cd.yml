name: CD

# Agentic CI/CD Factory Template
# Progressive deployment: dev → test → prod (prod requires manual approval)

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "web/**"
      - "cicd/contract.yml"
      - ".github/workflows/cd.yml"
      - ".github/workflows/_reusable-deploy-azure-tf.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy"
        required: true
        default: dev
        type: choice
        options: [dev, test, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Minimum workflow-level permissions — id-token:write granted per job only.
permissions:
  contents: read

jobs:
  deploy-dev:
    name: Deploy → dev
    permissions:
      contents: read
      id-token: write   # OIDC — scoped to this job only
    uses: ./.github/workflows/_reusable-deploy-azure-tf.yml
    with:
      environment: dev
      infra_path:  infra/envs/dev
      tf_state_key: agenticcicdwftfstaticwebkv/dev.terraform.tfstate
    secrets: inherit

  deploy-test:
    name: Deploy → test
    needs: deploy-dev
    permissions:
      contents: read
      id-token: write   # OIDC — scoped to this job only
    uses: ./.github/workflows/_reusable-deploy-azure-tf.yml
    with:
      environment: test
      infra_path:  infra/envs/test
      tf_state_key: agenticcicdwftfstaticwebkv/test.terraform.tfstate
    secrets: inherit

  deploy-prod:
    name: Deploy → prod
    needs: deploy-test
    permissions:
      contents: read
      id-token: write   # OIDC — scoped to this job only
    uses: ./.github/workflows/_reusable-deploy-azure-tf.yml
    with:
      environment: prod
      infra_path:  infra/envs/prod
      tf_state_key: agenticcicdwftfstaticwebkv/prod.terraform.tfstate
    secrets: inherit

  upload-static-files-dev:
    name: Upload Static Website Files (dev)
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          az --version
      - name: Get storage account name
        id: tfoutput
        run: |
          cd infra/envs/dev
          echo "name=$(terraform output -raw storage_account_name)" >> $GITHUB_OUTPUT
          echo "rg=$(terraform output -raw resource_group_name)" >> $GITHUB_OUTPUT
      - name: Get storage account key
        id: getkey
        run: |
          key=$(az storage account keys list --resource-group ${{ steps.tfoutput.outputs.rg }} --account-name ${{ steps.tfoutput.outputs.name }} --query [0].value -o tsv)
          echo "key=$key" >> $GITHUB_OUTPUT
      - name: Upload files to $web
        run: |
          az storage blob upload-batch \
            -d '$web' \
            -s ./web/dev \
            --account-name ${{ steps.tfoutput.outputs.name }}
        env:
          AZURE_STORAGE_KEY: ${{ steps.getkey.outputs.key }}

  upload-static-files-test:
    name: Upload Static Website Files (test)
    needs: deploy-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          az --version
      - name: Get storage account name
        id: tfoutput
        run: |
          cd infra/envs/test
          echo "name=$(terraform output -raw storage_account_name)" >> $GITHUB_OUTPUT
          echo "rg=$(terraform output -raw resource_group_name)" >> $GITHUB_OUTPUT
      - name: Get storage account key
        id: getkey
        run: |
          key=$(az storage account keys list --resource-group ${{ steps.tfoutput.outputs.rg }} --account-name ${{ steps.tfoutput.outputs.name }} --query [0].value -o tsv)
          echo "key=$key" >> $GITHUB_OUTPUT
      - name: Upload files to $web
        run: |
          az storage blob upload-batch \
            -d '$web' \
            -s ./web/test \
            --account-name ${{ steps.tfoutput.outputs.name }}
        env:
          AZURE_STORAGE_KEY: ${{ steps.getkey.outputs.key }}

  upload-static-files-prod:
    name: Upload Static Website Files (prod)
    needs: deploy-prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          az --version
      - name: Get storage account name
        id: tfoutput
        run: |
          cd infra/envs/prod
          echo "name=$(terraform output -raw storage_account_name)" >> $GITHUB_OUTPUT
          echo "rg=$(terraform output -raw resource_group_name)" >> $GITHUB_OUTPUT
      - name: Get storage account key
        id: getkey
        run: |
          key=$(az storage account keys list --resource-group ${{ steps.tfoutput.outputs.rg }} --account-name ${{ steps.tfoutput.outputs.name }} --query [0].value -o tsv)
          echo "key=$key" >> $GITHUB_OUTPUT
      - name: Upload files to $web
        run: |
          az storage blob upload-batch \
            -d '$web' \
            -s ./web/prod \
            --account-name ${{ steps.tfoutput.outputs.name }}
        env:
          AZURE_STORAGE_KEY: ${{ steps.getkey.outputs.key }}
