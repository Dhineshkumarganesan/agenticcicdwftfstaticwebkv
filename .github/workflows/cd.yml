name: CD

# Agentic CI/CD Factory Template
# Progressive deployment: dev → test → prod (prod requires manual approval)

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "web/**"
      - "cicd/contract.yml"
      - ".github/workflows/cd.yml"
      - ".github/workflows/_reusable-deploy-azure-tf.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy"
        required: true
        default: dev
        type: choice
        options: [dev, test, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Minimum workflow-level permissions — id-token:write granted per job only.
permissions:
  contents: read

jobs:
  deploy-dev:
    name: Deploy → dev
    permissions:
      contents: read
      id-token: write   # OIDC — scoped to this job only
    uses: ./.github/workflows/_reusable-deploy-azure-tf.yml
    with:
      environment: dev
      infra_path:  infra/envs/dev
      tf_state_key: agenticcicdwftfstaticwebkv/dev.terraform.tfstate
    secrets: inherit

  upload-static-files-dev:
    name: Upload Static Website Files (dev)
    needs: deploy-dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Download Terraform outputs
        uses: actions/download-artifact@v4
        with:
          name: deploy-evidence-dev-${{ github.run_id }}
          path: tfout
      - name: Parse Terraform outputs
        id: tfoutput
        run: |
          name=$(jq -r '.storage_account_name.value' tfout/deploy-dev-output.json)
          echo "name=$name" >> $GITHUB_OUTPUT
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Upload files to $web
        run: |
          ls -l ./web/dev
          az storage blob upload-batch \
            --destination '$web' \
            --source ./web/dev \
            --account-name "${{ steps.tfoutput.outputs.name }}" \
            --auth-mode login


  deploy-test:
    name: Deploy → test
    needs: deploy-dev
    permissions:
      contents: read
      id-token: write   # OIDC — scoped to this job only
    uses: ./.github/workflows/_reusable-deploy-azure-tf.yml
    with:
      environment: test
      infra_path:  infra/envs/test
      tf_state_key: agenticcicdwftfstaticwebkv/test.terraform.tfstate
    secrets: inherit

  upload-static-files-test:
    name: Upload Static Website Files (test)
    needs: deploy-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Download Terraform outputs
        uses: actions/download-artifact@v4
        with:
          name: deploy-evidence-test-${{ github.run_id }}
          path: tfout
      - name: Parse Terraform outputs
        id: tfoutput
        run: |
          name=$(jq -r '.storage_account_name.value' tfout/deploy-test-output.json)
          echo "name=$name" >> $GITHUB_OUTPUT
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Upload files to $web
        run: |
          ls -l ./web/test
          az storage blob upload-batch \
            --destination '$web' \
            --source ./web/test \
            --account-name "${{ steps.tfoutput.outputs.name }}" \
            --auth-mode login


  deploy-prod:
    name: Deploy → prod
    needs: deploy-test
    permissions:
      contents: read
      id-token: write   # OIDC — scoped to this job only
    uses: ./.github/workflows/_reusable-deploy-azure-tf.yml
    with:
      environment: prod
      infra_path:  infra/envs/prod
      tf_state_key: agenticcicdwftfstaticwebkv/prod.terraform.tfstate
    secrets: inherit

  upload-static-files-prod:
    name: Upload Static Website Files (prod)
    needs: deploy-prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Download Terraform outputs
        uses: actions/download-artifact@v4
        with:
          name: deploy-evidence-prod-${{ github.run_id }}
          path: tfout
      - name: Parse Terraform outputs
        id: tfoutput
        run: |
          name=$(jq -r '.storage_account_name.value' tfout/deploy-prod-output.json)
          echo "name=$name" >> $GITHUB_OUTPUT
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Upload files to $web
        run: |
          ls -l ./web/prod
          az storage blob upload-batch \
            --destination '$web' \
            --source ./web/prod \
            --account-name "${{ steps.tfoutput.outputs.name }}" \
            --auth-mode login
