name: Reusable - Destroy (Azure Terraform)

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment name (dev | test | prod)"
        required: true
        type: string
      infra_path:
        description: "Relative path to the Terraform root"
        required: true
        type: string
      tf_state_key:
        description: "Terraform backend state file key"
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

jobs:
  destroy:
    name: Destroy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4  # updated for clarity

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ inputs.infra_path }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=${{ inputs.tf_state_key }}"

      - name: Terraform destroy
        working-directory: ${{ inputs.infra_path }}
        run: |
          terraform destroy -auto-approve -lock-timeout=5m || echo "State lock timeout ignored for ephemeral lab"

      - name: Capture Terraform outputs
        if: always()
        working-directory: ${{ inputs.infra_path }}
        run: |
          mkdir -p ../../../reports
          terraform output -json \
            > ../../../reports/destroy-${{ inputs.environment }}-output.json 2>/dev/null \
            || echo "{}" > ../../../reports/destroy-${{ inputs.environment }}-output.json

      - name: Upload destroy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: destroy-evidence-${{ inputs.environment }}-${{ github.run_id }}
          path: reports/destroy-${{ inputs.environment }}-output.json
          if-no-files-found: warn