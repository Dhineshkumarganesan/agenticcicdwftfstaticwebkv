name: Reusable - Terraform CI

on:
  workflow_call:
    inputs:
      infra_path:
        description: "Relative path to the Terraform root"
        required: true
        type: string
      tf_state_key:
        description: "Terraform backend state file key (unused in CI, kept for interface compatibility)"
        required: true
        type: string

jobs:
  terraform-ci:
    name: Terraform CI (fmt / validate / plan)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        working-directory: ${{ inputs.infra_path }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ${{ inputs.infra_path }}
        run: terraform validate

      - name: Terraform plan (no backend)
        working-directory: ${{ inputs.infra_path }}
        run: terraform plan

      - name: Sanitize artifact name
        id: artifact-name
        run: |
          SAFE_KEY="${{ inputs.tf_state_key }}"
          SAFE_KEY="${SAFE_KEY//\//-}"
          echo "name=tfplan-${SAFE_KEY}-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Upload Terraform plan artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4.6.1
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ inputs.infra_path }}
          retention-days: 1
          if-no-files-found: warn
