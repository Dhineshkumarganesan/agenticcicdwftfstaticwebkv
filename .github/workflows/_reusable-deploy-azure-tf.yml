name: Reusable - Deploy (Azure Terraform)

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment name (dev | test | prod)"
        required: true
        type: string
      infra_path:
        description: "Relative path to the Terraform root"
        required: true
        type: string
      tf_state_key:
        description: "Terraform backend state file key"
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_CREDENTIALS:  # optional JSON creds for azure/login
        required: false

jobs:
  deploy:
    name: Deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --- Optional cleanup for ephemeral home lab ---
      - name: Delete old environment RG
        run: |
          az group delete -n rg-${{ inputs.environment }} --yes --no-wait || echo "RG not found"

      # --- Terraform Init ---
      - name: Terraform init
        working-directory: ${{ inputs.infra_path }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=${{ inputs.tf_state_key }}"

      # --- Terraform Apply ---
      - name: Terraform apply
        working-directory: ${{ inputs.infra_path }}
        run: terraform apply -auto-approve

      # --- Capture outputs for reports ---
      - name: Capture Terraform outputs
        if: always()
        working-directory: ${{ inputs.infra_path }}
        run: |
          mkdir -p ../../../reports
          terraform output -json \
            > ../../../reports/deploy-${{ inputs.environment }}-output.json 2>/dev/null \
            || echo "{}" > ../../../reports/deploy-${{ inputs.environment }}-output.json

      # --- Upload artifact for evidence ---
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-evidence-${{ inputs.environment }}-${{ github.run_id }}
          path: reports/deploy-${{ inputs.environment }}-output.json
          if-no-files-found: warn