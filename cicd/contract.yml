# cicd/contract.yml
# ─────────────────────────────────────────────────────────────────────────────
# Agentic CI/CD Factory Template — Workload Intent + Guardrail Policy
#
# TEMPLATE VALUES — replace YOUR-* placeholders before onboarding.
# This file is the single source of truth for both deployment intent and
# runtime guardrail enforcement (validated by scripts/contract_lint.py in CI).
# ─────────────────────────────────────────────────────────────────────────────

workload:
  name: agenticcicdwftfstaticwebkv
  owner: dhineshkumarganesan
  repo: agenticcicdwftfstaticwebkv
  cloud: azure
  region: westeurope
  environments:
    - dev
    - test
    - prod

# ── Resource intent (read by @terraform-module-expert to scaffold Terraform) ─
resources:
  - type: storage_account
    purpose: static_website_hosting
    replication: LRS
    environments: [dev, test, prod]
    region: westeurope
    settings:
      https_only: true
      min_tls_version: TLS1_2
      static_website: true
      static_website_content_path: ./site-content/

# ── Deployment intent ────────────────────────────────────────────────────────
pipeline:
  ci:
    triggers:
      - push
      - pull_request
      - workflow_dispatch
    jobs:
      - contract-lint
      - iac-scan
      - sbom
      - terraform-ci

  cd:
    strategy: progressive            # dev → test → prod
    approval_required:
      - prod
    rollback: manual

  destroy:
    requires_manual_approval: true
    confirmation_keyword: DESTROY

# ── Guardrail policy (enforced at runtime by contract_lint.py) ───────────────
guardrails:

  # Actions and providers that are permitted in workflows / Terraform
  allowed_registries:
    sha_pinning_required: false
    actions:
      - github.com/actions          # actions/checkout, setup-python, etc.
      - github.com/azure            # azure/login
      - github.com/bridgecrewio    # checkov
      - github.com/github          # codeql-action
      - github.com/hashicorp       # setup-terraform
    terraform_providers:
      - registry.terraform.io/hashicorp   # azurerm, random, etc.

  # Safe-outputs: what agents/workflows are permitted to do
  safe_outputs:
    allowed_actions:
      - create_pull_request
      - add_issue_comment
      - add_pr_review_comment
      - upload_artifact
      - create_check_run
    blocked_actions:
      - push_to_protected_branch
      - delete_branch
      - modify_repository_settings
      - access_repository_secrets_directly

  # Agent permission defaults
  agent_permissions:
    read_only_by_default: true
    repository_write: false          # all writes must go via PRs (safe_outputs)
    secret_access: false             # secrets injected by GitHub Actions only

  # Network restrictions
  network:
    allowed_outbound:
      - registry.terraform.io
      - management.azure.com
      - login.microsoftonline.com
      - github.com
      - api.github.com
    blocked: []

  # Manifest review — generated workflows must be reviewed before merging
  manifest_review:
    required: true
    artifact_name_pattern: "workflow-manifest-*"

  # Simulation mode for governance testing: block mutating Azure/deploy commands
  # so CI can validate policy without creating or changing resources.
  execution_mode:
    simulation_only: false
    blocked_run_patterns:
      - "terraform apply"
      - "terraform destroy"
      - "az group delete"
      - "az storage blob upload-batch"

# ── Governance & Compliance Policies ──────────────────────────────────────────
governance:
  
  # Compliance checks for all infrastructure
  compliance:
    enabled: true
    agent: compliance-gate
    
    # Encryption requirements
    encryption:
      storage_account:
        https_only: true
        min_tls_version: "TLS1_2"
      key_vault:
        purge_protection: true
      database:
        transparent_data_encryption: true
    
    # Required tagging by environment
    tagging:
      prod:
        required_tags: [environment, project, owner, cost_center, classification]
        hard_fail: true
      test:
        required_tags: [environment, project, owner]
        hard_fail: false
      dev:
        required_tags: [environment, project]
        hard_fail: false
    
    # Naming conventions (regex patterns)
    naming_conventions:
      storage_account: "^st[a-z0-9]{1,21}$"
      key_vault: "^[a-z][a-z0-9-]{1,22}$"
      virtual_network: "^vnet-[a-z0-9-]{1,}$"
    
    # Region restrictions
    allowed_regions:
      - westeurope
      - northeurope
    
    # Audit trail
    audit_trail:
      enabled: true
      log_path: "./.github/audit-logs"
      retention_days: 90
